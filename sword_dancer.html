<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gwen's Landing Page</title>
    <script src="canvas.js"></script>
    <script src="sword_dancer.js" defer />
    </script>
    <style>
        :root {
            --c: 150;
            --G1: hsl(var(--c), 20%, 40%);
            --G2: hsl(var(--c), 20%, 80%);
        }

        * {
            padding: 0;
            margin: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0 5%;
            background-color: var(--G1)
        }

        .content {
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: var(--G2);
        }

        .header {
            display: flex;
            flex-direction: column;
            align-content: center;
            justify-content: center;
            align-items: center;
        }

        .body {
            flex: 1 1 auto;
            min-height: 0;
        }

        canvas {
            background-color: black;
        }
    </style>
</head>

<body>
    <div class="content">
        <div class="header">
            <h1> Leaping Lift</h1>
        </div>
        <div class="body">
            <canvas id="canvas"></canvas>
        </div>
    </div>
</body>

</html>
